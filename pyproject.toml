[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pbi-converter"
version = "0.1.0"
description = "Tableau to Power BI migration toolkit"
authors = [{name = "OpenAI", email = "noreply@example.com"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "lxml",
  "pyyaml",
  "pydantic",
  "jinja2",
  "requests",
  "msal",
  "rich",
  "typer",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "black",
  "ruff",
  "mypy",
]

[project.scripts]
migrator = "migrator.cli:app"

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
